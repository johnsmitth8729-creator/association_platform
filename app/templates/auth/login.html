{% extends "base.html" %}

{% block auth_content %}
<div class="min-h-screen flex items-center justify-center px-6">
    <div class="glass-card p-10 w-full max-w-md animate-fade-in">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-slate-900 mb-2">{{ g.translations.get('login') }}</h2>
            <p class="text-slate-500">{{ g.translations.get('welcome') }}</p>
        </div>

        <form method="POST">
            <div class="mb-5">
                <label class="block text-sm font-semibold mb-2">{{ g.translations.get('email') }}</label>
                <input type="email" name="email" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    placeholder="name@company.com">
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-semibold mb-2">{{ g.translations.get('password') }}</label>
                <input type="password" name="password" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    placeholder="••••••••">
            </div>

            <div class="flex items-center justify-between mb-8">
                <label class="flex items-center text-sm cursor-pointer">
                    <input type="checkbox" name="remember" class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500 mr-2">
                    <span class="text-slate-600">Eslab qolish</span>
                </label>
                <a href="#" class="text-sm font-medium text-blue-600 hover:underline">Parolni unutdingizmi?</a>
            </div>

            <button type="submit" class="w-full btn-primary-custom py-4 text-lg">
                {{ g.translations.get('login') }}
            </button>
        </form>

        <p class="text-center mt-8 text-slate-600">
            Hisobingiz yo'qmi? 
            <a href="{{ url_for('auth.register') }}" class="font-bold text-blue-600 hover:underline">{{ g.translations.get('register') }}</a>
        </p>
    </div>
</div>
{% endblock %}
