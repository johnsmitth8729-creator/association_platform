{% extends "base.html" %}

{% block auth_content %}
<div class="min-h-screen flex items-center justify-center px-6">
    <div class="glass-card p-10 w-full max-w-md animate-fade-in">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-slate-900 mb-2">{{ g.translations.get('register') }}</h2>
            <p class="text-slate-500">Platformaga a'zo bo'ling</p>
        </div>

        <form method="POST">
            <div class="mb-5">
                <label class="block text-sm font-semibold mb-2">{{ g.translations.get('username') }}</label>
                <input type="text" name="username" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    placeholder="johndoe">
            </div>

            <div class="mb-5">
                <label class="block text-sm font-semibold mb-2">{{ g.translations.get('email') }}</label>
                <input type="email" name="email" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    placeholder="name@company.com">
            </div>
            
            <div class="mb-8">
                <label class="block text-sm font-semibold mb-2">{{ g.translations.get('password') }}</label>
                <input type="password" name="password" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    placeholder="••••••••">
            </div>

            <button type="submit" class="w-full btn-primary-custom py-4 text-lg">
                {{ g.translations.get('register') }}
            </button>
        </form>

        <p class="text-center mt-8 text-slate-600">
            Hisobingiz bormi? 
            <a href="{{ url_for('auth.login') }}" class="font-bold text-blue-600 hover:underline">{{ g.translations.get('login') }}</a>
        </p>
    </div>
</div>
{% endblock %}
